name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Syntax & Asset Integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python Syntax Validation
        run: |
          python -m py_compile server.py scripts/generate_server_assets.py scripts/process_images.py

      - name: JavaScript Syntax Validation
        run: |
          node --check web/app.js
          node --check api/counter.js
          node --check server/worker.js
